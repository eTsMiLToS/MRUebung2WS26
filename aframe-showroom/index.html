
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My VR Showroom</title>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
<a-scene
  background="color: #DDEEFF"
  shadow="type: pcfsoft">    <!-- Load external 3D model -->
<a-assets>
  <a-asset-item
  id="carModel"
  src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Duck/glTF-Binary/Duck.glb">
</a-asset-item>
</a-assets>
<!-- Imported 3D model -->
<a-entity
  gltf-model="#carModel"
  position="0 1 -2"
  rotation="0 180 0"
  scale="1 1 1">
</a-entity>

   
<!-- Textured floor -->
<a-plane
  position="0 0 0"
  rotation="-90 0 0"
  width="20"
  height="20"
  material="src: https://cdn.aframe.io/a-painter/images/floor.jpg; repeat: 10 10"
  shadow="receive: true">
</a-plane>


    <!-- Five objects -->
<a-box
  position="-2 1 -4"
  color="#FF5555"
  shadow="cast: true">
</a-box>
    <a-sphere position="0 1.5 -4"
              radius="0.8"
              color="#55AAFF">
    </a-sphere>

    <a-cylinder position="2 1 -4"
                radius="0.5"
                height="2"
                color="#55FF99">
    </a-cylinder>

    <a-cone position="-1 1 -7"
            radius-bottom="0.7"
            height="2"
            color="#FFCC44">
    </a-cone>

    <a-torus position="1 2 -7"
             radius="0.7"
             color="#AA55FF">
    </a-torus>

    <!-- Lighting -->
    <a-light type="ambient" intensity="0.5"></a-light>
    <a-light
  type="directional"
  position="-3 8 4"
  intensity="1"
  castShadow="true"
  light="castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048">
</a-light>

    <!-- Camera -->
    <a-camera position="0 1.6 3"></a-camera>

  </a-scene>
</body>
</html>
